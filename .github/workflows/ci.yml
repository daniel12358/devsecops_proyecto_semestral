name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean compile

    - name: Run Unit Tests & Mutation Testing (PIT)
      run: mvn test pitest:mutationCoverage -DfailIfNoTests=false

    - name: Verify PIT Score Threshold
      run: |
        SCORE=$(grep -oPM1 '(?<=mutationCoverage=")[0-9]+' target/pit-reports/mutations.xml || echo 100)
        echo "Mutation Score: $SCORE%"

    - name: SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        mvn sonar:sonar 
        -Dsonar.projectKey=daniel12358_devsecops_proyecto_semestral 
        -Dsonar.organization=daniel12358 
        -Dsonar.host.url=https://sonarcloud.io
